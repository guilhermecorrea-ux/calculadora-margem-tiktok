<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Margem — Vitanuts × TikTok Shop</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --border: #E2DED6;
    --border-strong: #C8C3BA;
    --text-primary: #1A1916;
    --text-secondary: #6B6860;
    --text-muted: #9C9A94;
    --teal: #0F6E56;
    --teal-light: #E1F5EE;
    --teal-mid: #1D9E75;
    --amber: #854F0B;
    --amber-light: #FAEEDA;
    --red: #A32D2D;
    --red-light: #FCEBEB;
    --accent: #032A4D;
    --orange: #ED7032;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 0;
  }

  header {
    background: var(--accent);
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header .logo-text {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.3px;
  }

  header .logo-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    font-family: 'DM Mono', monospace;
    margin-top: 1px;
  }

  header .badge {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--orange);
    border: 1px solid rgba(237,112,50,0.4);
    padding: 4px 10px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .page-title {
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--text-muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  @media (min-width: 520px) {
    .product-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .prod-btn {
    padding: 14px 12px;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    width: 100%;
  }

  .prod-btn:hover {
    border-color: var(--border-strong);
    background: #f0ede8;
  }

  .prod-btn.active {
    border: 1.5px solid var(--teal-mid);
    background: var(--teal-light);
  }

  .prod-btn .pname {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .prod-btn .pprice {
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--text-secondary);
  }

  .prod-btn .pcmv {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .slider-group {
    margin-bottom: 20px;
  }

  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .slider-label {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .slider-value {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    background: var(--bg);
    padding: 3px 10px;
    border-radius: 4px;
    border: 0.5px solid var(--border);
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }

  input[type=range]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid #fff;
  }

  .toggle-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px;
    background: var(--amber-light);
    border-radius: 8px;
    border: 0.5px solid #FAC775;
    margin-top: 4px;
  }

  .toggle-row input[type=checkbox] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    margin-top: 1px;
    flex-shrink: 0;
    accent-color: var(--teal-mid);
  }

  .toggle-row label {
    font-size: 13px;
    color: var(--amber);
    cursor: pointer;
    line-height: 1.4;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 0;
  }

  @media (min-width: 520px) {
    .metrics-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .metric-card {
    background: var(--bg);
    border-radius: 8px;
    padding: 16px;
    border: 0.5px solid var(--border);
  }

  .metric-label {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .metric-value {
    font-size: 22px;
    font-weight: 500;
    color: var(--text-primary);
    font-family: 'DM Mono', monospace;
    letter-spacing: -0.5px;
  }

  .metric-value.success { color: var(--teal); }
  .metric-value.danger { color: var(--red); }
  .metric-value.warn { color: var(--amber); }

  .breakdown-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .breakdown-table tr {
    border-bottom: 0.5px solid var(--border);
  }

  .breakdown-table tr:last-child {
    border-bottom: none;
  }

  .breakdown-table td {
    padding: 11px 4px;
    color: var(--text-secondary);
  }

  .breakdown-table td:last-child {
    text-align: right;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-primary);
  }

  .breakdown-table tr.total td {
    font-weight: 500;
    color: var(--text-primary);
    background: var(--bg);
    padding-top: 12px;
    padding-bottom: 12px;
  }

  .breakdown-table tr.total td:first-child { border-radius: 6px 0 0 6px; padding-left: 10px; }
  .breakdown-table tr.total td:last-child { border-radius: 0 6px 6px 0; padding-right: 10px; }

  .neg { color: var(--red) !important; }
  .pos { color: var(--teal) !important; }

  .alert {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
  }

  .alert.warn { background: var(--amber-light); color: var(--amber); border: 0.5px solid #FAC775; }
  .alert.danger { background: var(--red-light); color: var(--red); border: 0.5px solid #F09595; }
  .alert.ok { background: var(--teal-light); color: var(--teal); border: 0.5px solid #5DCAA5; }

  .two-col {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  @media (min-width: 640px) {
    .two-col { grid-template-columns: 1fr 1fr; }
  }

  footer {
    text-align: center;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--text-muted);
    padding: 24px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div>
      <div class="logo-text">Vitanuts</div>
      <div class="logo-sub">Calculadora de Margem</div>
    </div>
  </div>
  <div class="badge">TikTok Shop</div>
</header>

<div class="container">
  <p class="page-title">Simulador de rentabilidade por produto</p>

  <div class="card">
    <p class="card-title">01 — Produto</p>
    <div class="product-grid" id="prodGrid"></div>
  </div>

  <div class="two-col">
    <div class="card">
      <p class="card-title">02 — Parâmetros de venda</p>

      <div class="slider-group">
        <div class="slider-header">
          <span class="slider-label">Preço de venda no TikTok</span>
          <span class="slider-value" id="precoVal">—</span>
        </div>
        <input type="range" id="precoSlider" min="10" max="120" step="0.5">
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <span class="slider-label">Desconto do vendedor</span>
          <span class="slider-value" id="descontoVal">R$ 0</span>
        </div>
        <input type="range" id="descontoSlider" min="0" max="40" step="1" value="0">
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <span class="slider-label">Comissão de afiliado</span>
          <span class="slider-value" id="afiliadoVal">10%</span>
        </div>
        <input type="range" id="afiliadoSlider" min="0" max="30" step="1" value="10">
      </div>

      <div class="toggle-row">
        <input type="checkbox" id="zerarComissao">
        <label for="zerarComissao">Ativar incentivo 0% de comissão da plataforma (primeiros 60 dias / até R$ 17.000)</label>
      </div>
    </div>

    <div class="card">
      <p class="card-title">03 — Detalhamento</p>
      <table class="breakdown-table" id="breakdown"></table>
    </div>
  </div>

  <div class="card">
    <p class="card-title">04 — Resultado</p>
    <div class="metrics-grid" id="metrics"></div>
  </div>

  <div id="alertBox" style="margin-top: 4px;"></div>

</div>

<footer>Vitanuts × TikTok Shop — uso interno</footer>

<script>
const produtos = [
  { nome: "Choc. Branco", preco: 35.90, cmv: 9 },
  { nome: "Choc. Crocante", preco: 29.90, cmv: 9 },
  { nome: "Cookies & Cream", preco: 35.90, cmv: 9 },
  { nome: "Pistache", preco: 57.45, cmv: 20 },
];

let selected = 0;

const grid = document.getElementById("prodGrid");
const precoSlider = document.getElementById("precoSlider");
const precoVal = document.getElementById("precoVal");
const descontoSlider = document.getElementById("descontoSlider");
const descontoVal = document.getElementById("descontoVal");
const afiliadoSlider = document.getElementById("afiliadoSlider");
const afiliadoVal = document.getElementById("afiliadoVal");
const zerarComissao = document.getElementById("zerarComissao");

function fmt(v) { return "R$ " + v.toFixed(2).replace(".", ","); }
function fmtPct(v) { return v.toFixed(1).replace(".", ",") + "%"; }

function renderButtons() {
  grid.innerHTML = "";
  produtos.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.className = "prod-btn" + (i === selected ? " active" : "");
    btn.innerHTML = `<div class="pname">${p.nome}</div><div class="pprice">${fmt(p.preco)}</div><div class="pcmv">CMV: ${fmt(p.cmv)}</div>`;
    btn.onclick = () => { selected = i; selectProduct(); };
    grid.appendChild(btn);
  });
}

function selectProduct() {
  renderButtons();
  const p = produtos[selected];
  precoSlider.min = Math.max(10, p.cmv + 5);
  precoSlider.max = Math.round(p.preco * 2.5);
  precoSlider.value = p.preco;
  descontoSlider.max = Math.round(p.preco * 0.5);
  descontoSlider.value = 0;
  update();
}

function colorClass(v, goodThreshold, warnThreshold) {
  if (v >= goodThreshold) return "success";
  if (v >= warnThreshold) return "warn";
  return "danger";
}

function update() {
  const p = produtos[selected];
  const preco = parseFloat(precoSlider.value);
  const desconto = parseFloat(descontoSlider.value);
  const afiliadoPct = parseFloat(afiliadoSlider.value) / 100;
  const semComissao = zerarComissao.checked;

  precoVal.textContent = fmt(preco);
  descontoVal.textContent = fmt(desconto);
  afiliadoVal.textContent = Math.round(afiliadoSlider.value) + "%";

  const baseComissao = preco - desconto;
  const taxaPlataforma = semComissao ? 0 : baseComissao * 0.06;
  const tarifaItem = 4;
  const comissaoAfiliado = preco * afiliadoPct;
  const totalCustos = desconto + taxaPlataforma + tarifaItem + comissaoAfiliado;
  const receitaLiquida = preco - totalCustos;
  const lucro = receitaLiquida - p.cmv;
  const margem = (lucro / preco) * 100;
  const roi = p.cmv > 0 ? (lucro / p.cmv) * 100 : 0;

  document.getElementById("metrics").innerHTML = `
    <div class="metric-card">
      <div class="metric-label">Receita líquida</div>
      <div class="metric-value ${receitaLiquida < 0 ? 'danger' : ''}">${fmt(receitaLiquida)}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Lucro</div>
      <div class="metric-value ${lucro < 0 ? 'danger' : lucro > 5 ? 'success' : 'warn'}">${fmt(lucro)}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Margem líquida</div>
      <div class="metric-value ${colorClass(margem, 20, 10)}">${fmtPct(margem)}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">ROI sobre CMV</div>
      <div class="metric-value ${colorClass(roi, 100, 50)}">${fmtPct(roi)}</div>
    </div>
  `;

  document.getElementById("breakdown").innerHTML = `
    <tr><td>Preço de venda</td><td class="pos">${fmt(preco)}</td></tr>
    <tr><td>(-) Desconto do vendedor</td><td class="neg">- ${fmt(desconto)}</td></tr>
    <tr><td>(-) Comissão da plataforma ${semComissao ? "(0% — incentivo)" : "(6%)"}</td><td class="neg">- ${fmt(taxaPlataforma)}</td></tr>
    <tr><td>(-) Tarifa por item vendido</td><td class="neg">- ${fmt(tarifaItem)}</td></tr>
    <tr><td>(-) Comissão de afiliado (${Math.round(afiliadoSlider.value)}%)</td><td class="neg">- ${fmt(comissaoAfiliado)}</td></tr>
    <tr class="total"><td>= Receita líquida</td><td class="${receitaLiquida < 0 ? 'neg' : 'pos'}">${fmt(receitaLiquida)}</td></tr>
    <tr><td>(-) CMV</td><td class="neg">- ${fmt(p.cmv)}</td></tr>
    <tr class="total"><td>= Lucro</td><td class="${lucro < 0 ? 'neg' : 'pos'}">${fmt(lucro)}</td></tr>
  `;

  const alertBox = document.getElementById("alertBox");
  if (lucro < 0) {
    alertBox.innerHTML = `<div class="alert danger">Operação no prejuízo com esses parâmetros. Aumente o preço ou reduza descontos e comissões.</div>`;
  } else if (margem < 10) {
    alertBox.innerHTML = `<div class="alert warn">Margem abaixo de 10% — operação vulnerável a devoluções e variações de custo.</div>`;
  } else {
    alertBox.innerHTML = `<div class="alert ok">Operação saudável com esses parâmetros.</div>`;
  }
}

precoSlider.oninput = update;
descontoSlider.oninput = update;
afiliadoSlider.oninput = update;
zerarComissao.onchange = update;

selectProduct();
</script>
</body>
</html>
